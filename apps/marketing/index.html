<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The PARTHA mark. The SVG is preferred and carries the mark at full
         resolution, so it stays sharp on any display; the PNGs are there for
         apple-touch, which cannot take an SVG, and for anything that will not
         load one. 32px is the smallest the labyrinth still reads at, so
         nothing below it is declared. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PARTHA turns a repository revision into one sealed, queryable model and uses it to explain architecture, dependencies, review findings, insights, and documentation. See a scripted walkthrough, or run it yourself."
    />
    <title>PARTHA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Typography as specified by the iteration-1 landing design (Figma
         f1HlSxjl8pvvOm86XFPZEJ): Montserrat = display / headings / buttons,
         Proza Libre = all reading text, Cormorant Upright = editorial accents.
         Note this is plain Montserrat, not Montserrat Alternates: the design
         file uses Montserrat throughout. Fallback rendering is treated as a
         failure for approved marketing output, so real weights load here. -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&family=Proza+Libre:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Upright:ital,wght@0,400;0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Ported from apps/frontend/index.html (#382): prevents a white flash
         behind the landing artwork before React mounts and App's own
         scoped .landing-dark class takes over. This whole site is the
         landing page, so unlike the real app there's no pathname check. */
      html[data-landing-theme-boot='dark'] body {
        background: #150b12;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('partha-landing-theme');
          var dark = stored === 'dark' || ((stored === 'system' || !stored) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-landing-theme-boot', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
