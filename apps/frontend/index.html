<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The PARTHA mark. The SVG is preferred and carries the mark at full
         resolution, so it stays sharp on any display; the PNGs are there for
         apple-touch, which cannot take an SVG, and for anything that will not
         load one. 32px is the smallest the labyrinth still reads at, so
         nothing below it is declared. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@200;300;400;500;600;700;800&family=Proza+Libre:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Upright:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <title>PARTHA</title>
    <style>
      /* Prevents a white flash behind the landing artwork before React
         mounts and the LandingPage component takes over via its own
         scoped .landing-dark class. Never applies outside "/" and never
         touches any token other than the raw background paint. */
      html[data-landing-theme-boot='dark'] body {
        background: #000;
      }
    </style>
    <script>
      (function () {
        try {
          if (window.location.pathname !== '/') return;
          var stored = window.localStorage.getItem('partha-landing-theme');
          var dark = stored === 'dark' || ((stored === 'system' || !stored) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-landing-theme-boot', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
