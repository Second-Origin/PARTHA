[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "partha-backend"
version = "0.1.0"
description = "FastAPI backend for PARTHA repository architecture intelligence."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic[email]>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyJWT>=2.9.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "SQLAlchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-typescript>=0.23.0",
  "python-multipart>=0.0.9",
  "anyio>=4.0.0",
  # The sender relies directly on httpcore's documented sni_hostname request
  # extension while connecting to an IP-pinned URL.
  "httpcore>=1.0.9,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "xhtml2pdf>=0.2.16"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
