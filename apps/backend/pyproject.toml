[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "partha-backend"
version = "0.1.0"
description = "FastAPI backend for PARTHA repository architecture intelligence."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "SQLAlchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "GitPython>=3.1.43",
  "tree-sitter>=0.22.0",
  "networkx>=3.3",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "xhtml2pdf>=0.2.16",
  "pytest>=8.3.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
