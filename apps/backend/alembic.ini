[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.16+ warns when this is unset and falls back to legacy splitting on
# spaces, commas and colons. `os` uses the platform path separator, which is
# the correct reading of the single "." entry above and keeps the behaviour
# stable when the legacy fallback is eventually removed.
path_separator = os
sqlalchemy.url = sqlite:///./.local/partha.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
