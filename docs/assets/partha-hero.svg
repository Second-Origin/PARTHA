<svg width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">PARTHA Engineering Intelligence Platform</title>
  <desc id="desc">A dark engineering intelligence banner with a small Partha precision mark, repository graph paths, architecture layers, and actionable engineering outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.52" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="signal" x1="150" y1="90" x2="1420" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.32" stop-color="#38BDF8"/>
      <stop offset="0.66" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="blueprint" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#CBD5E1" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#blueprint)"/>
  <ellipse cx="1128" cy="250" rx="430" ry="248" fill="url(#halo)"/>

  <g opacity="0.42" fill="none" stroke="#94A3B8" stroke-width="1.5">
    <path d="M780 86h590"/>
    <path d="M780 414h590"/>
    <path d="M866 86v328"/>
    <path d="M1236 86v328"/>
  </g>

  <g fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M788 142h132c46 0 70 38 102 68s64 48 114 48h214" stroke-width="3.5"/>
    <path d="M788 250h186c44 0 68 62 112 62h264" stroke-width="3.5" opacity="0.78"/>
    <path d="M788 358h114c58 0 76-154 138-154h310" stroke-width="3.5" opacity="0.58"/>
  </g>

