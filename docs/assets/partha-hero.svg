<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="partha-title partha-desc">
  <title id="partha-title">PARTHA — Repository Intelligence Platform</title>
  <desc id="partha-desc">PARTHA is a self-hosted Repository Intelligence Platform for private and evolving codebases. Repository sources are ingested into a shared repository-understanding layer, which architecture, dependency, review, and documentation surfaces consume. AI is an optional downstream consumer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C14"/>
      <stop offset="0.55" stop-color="#0B1420"/>
      <stop offset="1" stop-color="#0A1A18"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1B2A3A" fill-opacity="0.5"/>
    </pattern>

    <linearGradient id="corePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102A24"/>
      <stop offset="1" stop-color="#0C1D1C"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <rect x="0" y="0" width="1600" height="500" fill="none" stroke="#1B2A3A" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="196" fill="#F1F5F9" font-size="86" font-weight="700" letter-spacing="6">PARTHA</text>
    <rect x="100" y="222" width="300" height="3" fill="url(#rule)"/>
    <text x="96" y="278" fill="#34D399" font-size="32" font-weight="600" letter-spacing="0.5">Repository Intelligence Platform</text>
    <text x="96" y="326" fill="#94A3B8" font-size="23" font-weight="400">Persistent understanding for private and evolving codebases</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <g stroke="#2C4A5E" stroke-width="2" fill="none">
      <path d="M1010 206 C 1040 206, 1040 250, 1074 250"/>
      <path d="M1010 294 C 1040 294, 1040 250, 1074 250"/>
    </g>
    <circle cx="1074" cy="250" r="3.5" fill="#5EA5C4"/>

    <g stroke="#2F6B57" stroke-width="2" fill="none">
      <path d="M1286 250 C 1320 250, 1320 148, 1354 148"/>
      <path d="M1286 250 C 1320 250, 1320 216, 1354 216"/>
      <path d="M1286 250 C 1320 250, 1320 284, 1354 284"/>
      <path d="M1286 250 C 1320 250, 1320 352, 1354 352"/>
    </g>
    <path d="M1286 250 C 1320 250, 1320 424, 1354 424" stroke="#2B3B4C" stroke-width="2" stroke-dasharray="5 5" fill="none"/>

    <text x="925" y="152" fill="#64748B" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="1.2">SOURCES</text>
    <rect x="840" y="178" width="170" height="56" rx="8" fill="#101B27" stroke="#274056" stroke-width="1.5"/>
    <text x="925" y="212" fill="#CBD5E1" font-size="20" text-anchor="middle">Archives</text>
    <rect x="840" y="266" width="170" height="56" rx="8" fill="#101B27" stroke="#274056" stroke-width="1.5"/>
    <text x="925" y="300" fill="#CBD5E1" font-size="20" text-anchor="middle">Git repositories</text>

    <rect x="1074" y="152" width="212" height="196" rx="12" fill="url(#corePanel)" stroke="#34D399" stroke-width="2"/>
    <text x="1180" y="190" fill="#5FBF9C" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="1.2">SHARED LAYER</text>
    <text x="1180" y="237" fill="#ECFDF5" font-size="23" font-weight="600" text-anchor="middle">Repository</text>
    <text x="1180" y="266" fill="#ECFDF5" font-size="23" font-weight="600" text-anchor="middle">Intelligence</text>
    <g stroke="#34D399" stroke-opacity="0.55" stroke-width="1.5" fill="none">
      <path d="M1122 300 L1156 318 L1204 300 L1238 318"/>
    </g>
    <g fill="#34D399" fill-opacity="0.85">
      <circle cx="1122" cy="300" r="4"/>
      <circle cx="1156" cy="318" r="4"/>
      <circle cx="1204" cy="300" r="4"/>
      <circle cx="1238" cy="318" r="4"/>
    </g>

    <text x="1452" y="98" fill="#64748B" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="1.2">CONSUMERS</text>
    <rect x="1354" y="124" width="196" height="48" rx="8" fill="#121D2A" stroke="#2A4256" stroke-width="1.5"/>
    <text x="1452" y="154" fill="#CBD5E1" font-size="20" text-anchor="middle">Architecture</text>
    <rect x="1354" y="192" width="196" height="48" rx="8" fill="#121D2A" stroke="#2A4256" stroke-width="1.5"/>
    <text x="1452" y="222" fill="#CBD5E1" font-size="20" text-anchor="middle">Dependencies</text>
    <rect x="1354" y="260" width="196" height="48" rx="8" fill="#121D2A" stroke="#2A4256" stroke-width="1.5"/>
    <text x="1452" y="290" fill="#CBD5E1" font-size="20" text-anchor="middle">Reviews</text>
    <rect x="1354" y="328" width="196" height="48" rx="8" fill="#121D2A" stroke="#2A4256" stroke-width="1.5"/>
    <text x="1452" y="358" fill="#CBD5E1" font-size="20" text-anchor="middle">Documentation</text>
    <rect x="1354" y="400" width="196" height="48" rx="8" fill="#0E1620" stroke="#2B3B4C" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="1452" y="430" fill="#7C8CA0" font-size="19" text-anchor="middle">AI (optional)</text>
  </g>
</svg>
