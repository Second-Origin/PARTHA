name: Bug Report
description: Report broken or incorrect behavior in PARTHA.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Public issues are the wrong
        channel — disclose them privately as described in
        [SECURITY.md](https://github.com/Second-Origin/PARTHA/blob/dev/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Include route, endpoint, input repository, and exact commands where possible.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 - Critical
        - P1 - High
        - P2 - Medium
        - P3 - Low
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, or response payloads. Do not include secrets, credentials, or private repository contents.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node/Python versions, and branch/commit.
