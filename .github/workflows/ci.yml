name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  repository-hygiene:

    name: Repository Hygiene

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Verify tracked generated files

        run: |

          matches=$(git ls-files | grep -E '(^|/)dist/|(^|/)\.env$|(^|/)\.env\.(local|development|production|test)$' || true)

          if [ -n "$matches" ]; then

            echo "Tracked generated or environment files detected:"

            echo "$matches"

            exit 1

          fi

          echo "Repository hygiene checks passed."

  frontend:
    name: Frontend
    needs: repository-hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/frontend

      - name: Lint
        run: npm --prefix apps/frontend run lint

      - name: Build
        run: npm --prefix apps/frontend run build

  backend:
    name: Backend
    needs: repository-hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r apps/backend/requirements.txt
          python -m pip install -e apps/backend --no-deps

      - name: Test
        working-directory: apps/backend
        run: python -m pytest

  docker-compose:
    name: Docker Compose
    needs: repository-hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t partha-backend:ci apps/backend

      - name: Validate Compose configuration
        run: docker compose config

      - name: Run Compose stack
        run: docker compose up --build -d

      - name: Verify Compose API readiness
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              exit 0
            fi
            docker compose ps
            sleep 2
          done

          docker compose logs api postgres redis
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v