name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/frontend

      - name: Lint
        run: npm --prefix apps/frontend run lint

      - name: Build
        run: npm --prefix apps/frontend run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e apps/backend

      - name: Test
        working-directory: apps/backend
        run: python -m pytest

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t partha-backend:ci apps/backend

      - name: Validate Compose configuration
        run: docker compose config

      - name: Run Compose stack
        run: docker compose up --build -d

      - name: Verify Compose API readiness
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              exit 0
            fi
            docker compose ps
            sleep 2
          done
          docker compose logs api postgres redis
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
