name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci --prefix apps/frontend

      - name: Install backend dependencies
        run: python -m pip install -e apps/backend

      - name: Lint frontend
        run: npm --prefix apps/frontend run lint

      - name: Build frontend
        run: npm --prefix apps/frontend run build

      - name: Test backend
        working-directory: apps/backend
        run: python -m pytest

      - name: Build backend image
        run: docker build -t partha-backend:release apps/backend

      - name: Validate Compose runtime
        run: |
          docker compose up --build -d
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          docker compose logs api postgres redis
          docker compose down -v
          exit 1

  github-release:
    name: Publish GitHub Release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes
