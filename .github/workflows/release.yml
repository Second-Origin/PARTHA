name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual dispatch runs validation only. GitHub Release publication is gated
    # to tag-triggered runs by the github-release job condition below.

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # Release validation runs the release-specific frontend and backend checks,
    # including Postgres and Redis-backed tests. It is not the complete PR CI
    # matrix: browser acceptance and the golden benchmark remain in ci.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partha
          POSTGRES_PASSWORD: partha
          POSTGRES_DB: partha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partha -d partha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci --prefix apps/frontend

      # Pinned lockfile install, matching every other CI job (ci.yml) --
      # `pip install -e "apps/backend[test]"` would instead resolve
      # pyproject.toml's loose ranges live from PyPI, so a release could be
      # validated against completely different, untested dependency versions
      # than what PR CI actually tested.
      - name: Install backend dependencies
        run: |
          python -m pip install -r apps/backend/requirements-dev.txt
          python -m pip install -e apps/backend --no-deps

      - name: Frontend dependency audit
        run: |
          node --test scripts/dependency-audit.test.mjs
          node scripts/dependency-audit.mjs

      - name: Lint frontend
        run: npm --prefix apps/frontend run lint

      - name: Check generated frontend API contract
        run: npm --prefix apps/frontend run generate:api-contract -- --check

      - name: Build frontend
        run: npm --prefix apps/frontend run build

      - name: Backend static analysis
        working-directory: apps/backend
        run: |
          ruff check app
          ruff format --check app
          mypy app

      - name: Validate capability registry and README
        run: python scripts/check-capabilities.py

      - name: Test backend
        working-directory: apps/backend
        env:
          PARTHA_TEST_PG_URL: postgresql+psycopg://partha:partha@localhost:5432/partha_test
          PARTHA_TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest

  github-release:
    name: Publish GitHub Release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes
